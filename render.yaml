# Staging-first template for the supervised pilot. Not yet deployed/verified.
# Duplicate into a separate Blueprint/environment for production after gates pass.
# API/worker receive restricted DATABASE_URL only. Migrate separately first.
# Upstash REDIS_URL must be a TLS Redis TCP URL, not the REST endpoint.
# Review paid compute selections before applying; no resources were purchased.
databases:
  - name: atlasops-staging-db
    databaseName: atlasops_staging
    user: atlasops_migrations
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: atlasops-staging-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 120
    healthCheckPath: /health/ready
    dockerCommand: sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: ENVIRONMENT
        value: "staging"
      - key: SEED_ON_STARTUP
        value: "false"
      - key: FEATURE_DEMO_SANDBOX
        value: "false"
      - key: ALLOW_CREATE_ALL_ON_STARTUP
        value: "false"
      - key: CONNECTOR_SYNC_INLINE
        value: "false"
      - key: FEATURE_BILLING_ENFORCE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        sync: false
      - key: WORKOS_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PROFESSIONAL_MONTHLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_ORIGIN_CHECK
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: LEAD_CAPTURE_ENABLED
        value: "false"
  - type: worker
    name: atlasops-staging-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 120
    dockerCommand: arq app.worker.WorkerSettings
    envVars:
      - key: ENVIRONMENT
        value: "staging"
      - key: SEED_ON_STARTUP
        value: "false"
      - key: FEATURE_DEMO_SANDBOX
        value: "false"
      - key: ALLOW_CREATE_ALL_ON_STARTUP
        value: "false"
      - key: CONNECTOR_SYNC_INLINE
        value: "false"
      - key: FEATURE_BILLING_ENFORCE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
