name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  frontend-e2e:
    name: Frontend Playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Prepare standalone static assets
        run: |
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
      - run: npm run test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_PORT: "3000"
          PORT: "3000"
          HOSTNAME: "127.0.0.1"

  backend-sqlite:
    name: Backend pytest (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./_ci_test.db
      SEED_ON_STARTUP: "false"
      SESSION_SECRET: ci-session-secret-min-32-characters!!
      CREDENTIALS_ENCRYPTION_KEY: ""
      ENVIRONMENT: development
      FEATURE_BILLING_ENFORCE: "false"
      WORKOS_API_KEY: ""
      STRIPE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  security:
    name: Security gates (secrets, deps, attack matrix)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./_ci_security.db
      SEED_ON_STARTUP: "false"
      SESSION_SECRET: ci-session-secret-min-32-characters!!
      CREDENTIALS_ENCRYPTION_KEY: ""
      ENVIRONMENT: development
      FEATURE_BILLING_ENFORCE: "false"
      WORKOS_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      CONNECTOR_SYNC_INLINE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the PR base/head range, including the base parent.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Security-focused pytest
        working-directory: backend
        run: |
          pytest -q \
            tests/test_security_attack_matrix.py \
            tests/test_security_hardening.py \
            tests/test_ssrf.py \
            tests/test_csrf.py \
            tests/test_auth_guards.py \
            tests/test_stripe_webhooks.py \
            tests/test_startup_checks.py \
            tests/test_tenant_isolation.py \
            tests/test_billing_authz.py
      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Frontend secret hygiene
        working-directory: frontend
        run: |
          if command -v rg >/dev/null; then
            if rg -n "WORKOS_API_KEY|STRIPE_SECRET|CREDENTIALS_ENCRYPTION|sk_live_|whsec_" \
              --glob '!node_modules/**' --glob '!**/.next/**' .; then
              echo "Potential secret reference in frontend sources"
              exit 1
            fi
          else
            if grep -R -n -E 'WORKOS_API_KEY|STRIPE_SECRET|CREDENTIALS_ENCRYPTION|sk_live_|whsec_' \
              --exclude-dir=node_modules --exclude-dir=.next .; then
              echo "Potential secret reference in frontend sources"
              exit 1
            fi
          fi
          echo "No hardcoded backend secrets found in frontend sources"

  backend-postgres:
    name: Backend pytest + Alembic RLS (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supply
          POSTGRES_PASSWORD: supply
          POSTGRES_DB: supply_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supply -d supply_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://supply:supply@localhost:5432/supply_ci
      SEED_ON_STARTUP: "false"
      SESSION_SECRET: ci-session-secret-min-32-characters!!
      CREDENTIALS_ENCRYPTION_KEY: "ci-credentials-encryption-key!!"
      ENVIRONMENT: development
      FEATURE_BILLING_ENFORCE: "false"
      WORKOS_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      ALLOW_CREATE_ALL_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Create restricted test role
        env:
          PGPASSWORD: supply
        run: |
          psql -h localhost -U supply -d supply_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE supply_app LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO supply_app;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO supply_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO supply_app;
          SQL
      - name: Pytest including RLS
        run: |
          # conftest forces sqlite unless we override before import — use env
          # already set; patch conftest by not importing its DATABASE_URL override
          # when SUPPLY_CI_POSTGRES=1
          export DATABASE_URL=postgresql+psycopg://supply_app:ci-only-password@localhost:5432/supply_ci
          export SUPPLY_CI_POSTGRES=1
          pytest -q

      - name: Real Redis queue integration
        env:
          DATABASE_URL: postgresql+psycopg://supply_app:ci-only-password@localhost:5432/supply_ci
          SUPPLY_CI_POSTGRES: "1"
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q tests/test_salesforce_arq_redis.py

  container-build:
    name: Build production containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atlasops-backend:ci backend
      - run: docker build -t atlasops-frontend:ci --build-arg NEXT_PUBLIC_DEV_LOGIN=false frontend
